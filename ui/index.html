<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>tapa</title><link rel="icon" href="data:,">
<style>
:root { color-scheme: dark; background: #000; color: #ededed; font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
* { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
main { position: relative; overflow: hidden; height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0,1fr); background: #000; }
.kick-art { opacity: .10; z-index: 0; position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
main::after { content: ""; position: fixed; inset: 0; z-index: 10; pointer-events: none; border: 1px solid #fff; opacity: var(--border-alpha,0); }
.sliders { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); min-height: 0; }
compost-slider { display: block; width: 100%; height: 100%; min-width: 0; color: #ededed; --compost-accent: #ffffff12; --slider-vertical-width: 100%; --slider-thumb-size: 100%; }
compost-slider + compost-slider { border-left: 1px solid #ffffff09; }
compost-slider::part(panel) { height: 100%; display: block; position: relative; font-size: clamp(7px, 1.4vw, 9px); }
compost-slider::part(row) { position: absolute; bottom: 12px; left: 0; right: 0; z-index: 1; flex-direction: column-reverse; gap: 6px; padding: 0 3px; pointer-events: none; }
compost-slider::part(label) { text-transform: lowercase; letter-spacing: .04em; font-weight: 400; color: #c8c8c8; }
compost-slider::part(value) { opacity: 0; color: #a1a1a1; font: 9px ui-monospace,monospace; }
compost-slider[data-editing]::part(value) { opacity: 1; }
compost-slider::part(input) { height: 100%; width: 100%; margin: 0; cursor: ns-resize; }
compost-slider::part(track) { left: 0; width: 100%; background: rgba(255,255,255,.018); }
compost-slider::part(fill) { left: 0; width: 100%; background: rgba(255,255,255,.14); }
compost-slider::part(thumb) { display: none; }
compost-slider:focus-visible { outline: none; }
compost-slider:focus-visible::part(label) { color: #ddd; font-weight: 600; }
.decay-mode { position: absolute; z-index: 2; bottom: 31px; left: 0; width: calc(100% / 7); padding: 2px 0; border: 0; background: transparent; color: #999; font: 7px ui-monospace, monospace; cursor: pointer; }
.decay-mode { opacity: .75; }
.decay-mode[aria-pressed="true"] { opacity: 1; }
.decay-mode:focus-visible { outline: 1px solid #777; outline-offset: -2px; }
main:has(compost-slider[parameter-id="1"][data-editing]) .decay-mode { visibility: hidden; }
</style></head><body><main>
<canvas class="kick-art" aria-hidden="true"></canvas>
<div class="sliders">
<compost-slider orientation="vertical" interaction="absolute" parameter-id="1" label="Decay" min="20" max="4000" value="280" reset-value="280" step="1" unit=" ms" title="Decay at MIDI 60. Higher notes decay faster; lower notes ring longer. Cymbal material uses gentler tracking."></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="6" label="FM Ratio" min="0.25" max="16" value="2.6025" reset-value="2.6025" step="0.01" unit=" x"></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="2" label="FM Amount" min="0" max="100" value="50" reset-value="50" step="0.1" unit=" %"></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="3" label="Transient" min="0" max="100" value="30" reset-value="30" step="0.1" unit=" %"></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="4" label="Saturation" min="0" max="12" value="2" reset-value="2" step="0.1" unit=" dB"></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="5" label="Feedback" min="0" max="100" value="0" reset-value="0" step="0.1" unit=" %"></compost-slider>
<compost-slider orientation="vertical" interaction="absolute" parameter-id="8" label="Noise" min="0" max="100" value="0" reset-value="0" step="0.1" unit=" %"></compost-slider>
</div><button class="decay-mode" type="button" aria-label="Link FM decay to body" aria-pressed="false" title="Click to switch. Body: short FM attack. Linked: FM follows the body decay.">body</button></main><script type="module" src="main.js"></script></body></html>
